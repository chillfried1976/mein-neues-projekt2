<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter App</title>
    <!-- Bootstrap CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <main class="container mt-5">
        <h1 class="mb-4">Wetter App</h1>

        <div class="row">
            <div class="col-md-6">
                <h2>Ort suchen</h2>
                <div class="input-group mb-3">
                    <input type="text" id="cityInput" class="form-control" placeholder="z.B. Berlin">
                    <button id="searchBtn" class="btn btn-primary">Suchen</button>
                </div>
            </div>
        </div>

        <div id="weatherResult" class="mt-4">
            <!-- Weather data will be displayed here -->
        </div>

    </main>

    <!-- Our JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
